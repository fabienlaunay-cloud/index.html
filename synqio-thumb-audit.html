<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1280px; height:720px; overflow:hidden; font-family:'Segoe UI', system-ui, -apple-system, sans-serif; }
  .t { width:1280px; height:720px; position:relative; overflow:hidden;
    background:
      radial-gradient(700px 520px at 82% 18%, rgba(124,58,237,.45), transparent 60%),
      radial-gradient(560px 460px at 12% 88%, rgba(255,153,0,.16), transparent 60%),
      linear-gradient(125deg, #14102e 0%, #2a1f5c 55%, #191243 100%); }
  .grid { position:absolute; inset:0; opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size:90px 90px; }

  .left { position:absolute; left:56px; top:84px; z-index:10; }
  .brand { display:flex; align-items:center; gap:13px; margin-bottom:28px; }
  .mark { width:54px; height:54px; border-radius:14px; background:linear-gradient(135deg,#8b5cf6,#4f46e5);
    display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(124,58,237,.6); }
  .bname { color:#fff; font-size:34px; font-weight:800; letter-spacing:-1px; }
  h1 { color:#fff; font-size:76px; font-weight:900; line-height:1.04; letter-spacing:-3px;
    text-shadow:0 6px 30px rgba(0,0,0,.5); }
  h1 .amz { color:#ff9900; }
  .punch { display:inline-block; margin-top:20px; background:linear-gradient(100deg,#ffb020,#ff9900);
    color:#1a1033; font-size:66px; font-weight:900; letter-spacing:-2px; line-height:1;
    padding:16px 28px 22px; border-radius:22px; transform:rotate(-2deg);
    box-shadow:0 18px 50px rgba(255,153,0,.45), inset 0 -5px 0 rgba(0,0,0,.18); }
  .live { position:absolute; left:60px; bottom:64px; display:inline-flex; align-items:center; gap:12px;
    background:rgba(220,38,38,.16); border:2.5px solid rgba(248,113,113,.75); border-radius:16px;
    padding:12px 24px; color:#fecaca; font-size:30px; font-weight:800; letter-spacing:1px; z-index:10; }
  .dotr { width:16px; height:16px; border-radius:50%; background:#ef4444; box-shadow:0 0 16px #ef4444; }

  /* Right: before/after score */
  .scores { position:absolute; right:64px; top:150px; z-index:8; display:flex; align-items:center; gap:26px; }
  .sc { width:220px; height:220px; border-radius:50%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:#fff;
    box-shadow:0 26px 60px rgba(0,0,0,.5); border:10px solid; }
  .bad { border-color:#ef4444; transform:rotate(-4deg); }
  .good { border-color:#22c55e; transform:rotate(3deg) scale(1.22); box-shadow:0 30px 70px rgba(34,197,94,.35); }
  .sc .n { font-size:76px; font-weight:900; line-height:1; letter-spacing:-3px; }
  .bad .n { color:#dc2626; } .good .n { color:#16a34a; }
  .sc .l { font-size:22px; font-weight:800; color:#6b7280; margin-top:4px; }
  .fl { flex-shrink:0; }
  .verdict { position:absolute; right:96px; top:452px; z-index:9; transform:rotate(2deg);
    background:#dcfce7; color:#15803d; font-size:30px; font-weight:900; border-radius:16px;
    padding:14px 26px; box-shadow:0 16px 44px rgba(0,0,0,.4); border:3px solid #86efac; }
</style></head>
<body>
<div class="t">
  <div class="grid"></div>

  <div class="left">
    <div class="brand">
      <div class="mark"><svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="1.8" stroke-linejoin="round"/></svg></div>
      <span class="bname">SynqIO</span>
    </div>
    <h1>J'AUDITE UNE<br>FICHE <span class="amz">AMAZON</span></h1>
    <div class="punch">CORRIGÉE EN 3 MIN</div>
  </div>

  <div class="live"><span class="dotr"></span>EN DIRECT</div>

  <div class="scores">
    <div class="sc bad"><span class="n">38</span><span class="l">/100</span></div>
    <svg class="fl" width="90" height="60" viewBox="0 0 90 60" fill="none">
      <path d="M6 30 H62" stroke="#ffb020" stroke-width="12" stroke-linecap="round"/>
      <path d="M50 10 L78 30 L50 50" stroke="#ffb020" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <div class="sc good"><span class="n">94</span><span class="l">/100</span></div>
  </div>
  <div class="verdict">✓ Conforme juillet 2026</div>
</div>
</body></html>
