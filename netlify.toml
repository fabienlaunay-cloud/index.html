[build]
  publish = "frontend"

[[redirects]]
  from = "/api/*"
  to = "https://placeholder-railway-url.railway.app/api/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify"}

[[redirects]]
  from = "/health"
  to = "https://placeholder-railway-url.railway.app/health"
  status = 200
  force = true
