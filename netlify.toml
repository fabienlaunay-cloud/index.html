[build]
  base    = "frontend"
  publish = "."
  command = "printf '/api/* %s/api/:splat 200!\\n/health %s/health 200!\\n' \"$RAILWAY_BACKEND_URL\" \"$RAILWAY_BACKEND_URL\" > _redirects"

# URL du backend Railway — surcharger dans le dashboard Netlify par contexte
[build.environment]
  RAILWAY_BACKEND_URL = "https://web-production-393ef.up.railway.app"
