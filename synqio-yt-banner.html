<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:2048px; height:1152px; overflow:hidden; font-family:'Segoe UI', system-ui, -apple-system, sans-serif; }
  .banner {
    width:2048px; height:1152px; position:relative; overflow:hidden;
    background: linear-gradient(125deg, #0f0c29 0%, #2b2160 48%, #1c1740 100%);
  }
  .dots { position:absolute; inset:0; background-image:radial-gradient(circle, rgba(255,255,255,0.055) 1.4px, transparent 1.4px); background-size:46px 46px; }
  .glow { position:absolute; border-radius:50%; filter:blur(120px); }
  .g1 { width:760px; height:760px; background:rgba(124,58,237,0.30); top:-40px; left:640px; }
  .g2 { width:600px; height:600px; background:rgba(99,102,241,0.20); bottom:-120px; right:200px; }
  .g3 { width:480px; height:480px; background:rgba(168,85,247,0.15); top:200px; left:60px; }

  /* Strict YouTube "all devices" safe area: centred 1235 x 338. Everything fits here. */
  .safe {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:1235px; height:338px; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  }
  .brand { display:flex; align-items:center; gap:20px; margin-bottom:16px; }
  .mark { width:76px; height:76px; border-radius:20px; background:linear-gradient(135deg,#8b5cf6,#4f46e5);
    display:flex; align-items:center; justify-content:center; box-shadow:0 12px 34px rgba(124,58,237,0.55); }
  .bname { color:white; font-size:58px; font-weight:800; letter-spacing:-2px; }
  h1 { color:white; font-size:42px; font-weight:800; line-height:1.12; letter-spacing:-1.2px; margin-bottom:18px; }
  h1 .grad { background:linear-gradient(90deg,#a78bfa,#c4b5fd); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .chips { display:flex; gap:11px; flex-wrap:nowrap; justify-content:center; }
  .chip { display:inline-flex; align-items:center; gap:9px; background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15); border-radius:12px; padding:9px 16px;
    color:rgba(255,255,255,0.9); font-size:21px; font-weight:700; white-space:nowrap; }
  .chip .d { width:11px; height:11px; border-radius:50%; }
  .chip.primary { background:rgba(255,153,0,0.12); border-color:rgba(255,153,0,0.45); color:#ffca7a; }
</style></head>
<body>
<div class="banner">
  <div class="dots"></div>
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>

  <div class="safe">
    <div class="brand">
      <div class="mark">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </div>
      <span class="bname">SynqIO</span>
    </div>
    <h1>Le hub produit global — <span class="grad">optimisé Amazon</span>, diffusé partout</h1>
    <div class="chips">
      <span class="chip primary"><span class="d" style="background:#ff9900"></span>Amazon</span>
      <span class="chip"><span class="d" style="background:#38bdf8"></span>Site web</span>
      <span class="chip"><span class="d" style="background:#95bf47"></span>Shopify</span>
      <span class="chip"><span class="d" style="background:#a78bfa"></span>PIM</span>
      <span class="chip"><span class="d" style="background:#34d399"></span>API</span>
      <span class="chip"><span class="d" style="background:#ea4335"></span>Google Shopping</span>
    </div>
  </div>
</div>
</body></html>
