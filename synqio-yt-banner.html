<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:2048px; height:1152px; overflow:hidden; font-family:'Segoe UI', system-ui, -apple-system, sans-serif; }
  .banner {
    width:2048px; height:1152px; position:relative; overflow:hidden;
    background: linear-gradient(125deg, #0f0c29 0%, #2b2160 48%, #1c1740 100%);
  }
  .dots { position:absolute; inset:0; background-image:radial-gradient(circle, rgba(255,255,255,0.055) 1.4px, transparent 1.4px); background-size:46px 46px; }
  .glow { position:absolute; border-radius:50%; filter:blur(120px); }
  .g1 { width:760px; height:760px; background:rgba(124,58,237,0.30); top:-160px; left:600px; }
  .g2 { width:620px; height:620px; background:rgba(99,102,241,0.22); bottom:-220px; right:120px; }
  .g3 { width:520px; height:520px; background:rgba(168,85,247,0.16); top:120px; left:-140px; }

  /* YouTube safe area visible on every device: centred 1546 x 423. */
  .safe {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:1546px; height:423px; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  }
  .badge { display:inline-flex; align-items:center; gap:12px; background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.18); border-radius:24px; padding:9px 22px;
    color:#c4b5fd; font-size:23px; font-weight:700; margin-bottom:22px; letter-spacing:.3px; }
  .brand { display:flex; align-items:center; gap:22px; margin-bottom:20px; }
  .mark { width:88px; height:88px; border-radius:23px; background:linear-gradient(135deg,#8b5cf6,#4f46e5);
    display:flex; align-items:center; justify-content:center; box-shadow:0 14px 40px rgba(124,58,237,0.55); }
  .bname { color:white; font-size:64px; font-weight:800; letter-spacing:-2px; }
  h1 { color:white; font-size:50px; font-weight:800; line-height:1.1; letter-spacing:-1.4px; margin-bottom:14px; }
  h1 .grad { background:linear-gradient(90deg,#a78bfa,#c4b5fd); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .sub { color:rgba(255,255,255,0.62); font-size:26px; font-weight:600; margin-bottom:26px; }
  .chips { display:flex; gap:13px; flex-wrap:wrap; justify-content:center; max-width:1500px; }
  .chip { display:inline-flex; align-items:center; gap:11px; background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15); border-radius:14px; padding:11px 20px;
    color:rgba(255,255,255,0.9); font-size:24px; font-weight:700; }
  .chip .d { width:13px; height:13px; border-radius:50%; }
  .chip.primary { background:rgba(255,153,0,0.12); border-color:rgba(255,153,0,0.45); color:#ffca7a; }
</style></head>
<body>
<div class="banner">
  <div class="dots"></div>
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>

  <div class="safe">
    <div class="badge">🌐 LE HUB PRODUIT GLOBAL</div>
    <div class="brand">
      <div class="mark">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </div>
      <span class="bname">SynqIO</span>
    </div>
    <h1>Un seul contenu produit, <span class="grad">optimisé pour Amazon</span> — diffusé partout</h1>
    <div class="sub">Créez une fois. Poussez sur tous vos canaux.</div>
    <div class="chips">
      <span class="chip primary"><span class="d" style="background:#ff9900"></span>Amazon</span>
      <span class="chip"><span class="d" style="background:#38bdf8"></span>Site web</span>
      <span class="chip"><span class="d" style="background:#95bf47"></span>Shopify</span>
      <span class="chip"><span class="d" style="background:#a78bfa"></span>PIM</span>
      <span class="chip"><span class="d" style="background:#34d399"></span>API</span>
      <span class="chip"><span class="d" style="background:#ea4335"></span>Google Shopping</span>
    </div>
  </div>
</div>
</body></html>
