<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1280px; height:720px; overflow:hidden; font-family:'Segoe UI', system-ui, -apple-system, sans-serif; }
  .t { width:1280px; height:720px; position:relative; overflow:hidden;
    background:
      radial-gradient(700px 520px at 82% 18%, rgba(124,58,237,.45), transparent 60%),
      radial-gradient(560px 460px at 12% 88%, rgba(255,153,0,.16), transparent 60%),
      linear-gradient(125deg, #14102e 0%, #2a1f5c 55%, #191243 100%); }
  .grid { position:absolute; inset:0; opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size:90px 90px; }
  .left { position:absolute; left:56px; top:84px; z-index:10; }
  .brand { display:flex; align-items:center; gap:13px; margin-bottom:26px; }
  .mark { width:54px; height:54px; border-radius:14px; background:linear-gradient(135deg,#8b5cf6,#4f46e5);
    display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(124,58,237,.6); }
  .bname { color:#fff; font-size:34px; font-weight:800; letter-spacing:-1px; }
  h1 { color:#fff; font-size:76px; font-weight:900; line-height:1.04; letter-spacing:-3px;
    text-shadow:0 6px 30px rgba(0,0,0,.5); }
  h1 .hl { color:#a78bfa; }
  .punch { display:inline-block; margin-top:20px; background:linear-gradient(100deg,#ffb020,#ff9900);
    color:#1a1033; font-size:72px; font-weight:900; letter-spacing:-2px; line-height:1;
    padding:16px 30px 22px; border-radius:22px; transform:rotate(-2deg);
    box-shadow:0 18px 50px rgba(255,153,0,.45), inset 0 -5px 0 rgba(0,0,0,.18); }
  .chip { position:absolute; left:60px; bottom:60px; display:inline-flex; align-items:center; gap:12px;
    background:rgba(255,255,255,.08); border:2.5px solid rgba(167,139,250,.65); border-radius:16px;
    padding:12px 24px; color:#e9e4ff; font-size:28px; font-weight:800; letter-spacing:.5px; z-index:10; }
  .dotg { width:16px; height:16px; border-radius:50%; background:#4ade80; box-shadow:0 0 16px #4ade80; }

  .urlpill { position:absolute; right:300px; top:96px; z-index:9; transform:rotate(-3deg);
    background:#fff; border-radius:16px; padding:14px 24px; display:flex; align-items:center; gap:12px;
    box-shadow:0 18px 44px rgba(0,0,0,.45); }
  .urlpill .u { color:#374151; font-size:27px; font-weight:800; font-family:monospace; }
  .flow { position:absolute; right:430px; top:180px; z-index:9; transform:rotate(40deg); }

  /* Open magazine */
  .bookw { position:absolute; right:48px; top:230px; width:470px; height:330px; z-index:8;
    transform:rotate(2deg); filter:drop-shadow(0 30px 60px rgba(0,0,0,.55)); }
  .spread { position:absolute; inset:0; display:flex; }
  .pageL, .pageR { flex:1; background:#fff; padding:16px 14px; }
  .pageL { border-radius:14px 3px 3px 14px; box-shadow:inset -14px 0 22px rgba(0,0,0,.10); }
  .pageR { border-radius:3px 14px 14px 3px; box-shadow:inset 14px 0 22px rgba(0,0,0,.08); }
  .pgrid { display:grid; grid-template-columns:1fr 1fr; gap:9px; height:100%; }
  .prd { border:1.5px solid #eee9fb; border-radius:9px; padding:6px; display:flex; flex-direction:column; }
  .ph { flex:1; border-radius:6px; background:linear-gradient(135deg,#ede9fe,#ddd6fe);
    display:flex; align-items:center; justify-content:center; }
  .ln { height:6px; border-radius:3px; background:#e5e1f8; margin-top:6px; }
  .ln.a { width:85%; background:#c4b5fd; }
  .pr { color:#6d28d9; font-size:12px; font-weight:900; margin-top:4px; }
  /* turning corner */
  .curl { position:absolute; right:-6px; top:-10px; width:120px; height:120px; z-index:9; }
</style></head>
<body>
<div class="t">
  <div class="grid"></div>
  <div class="left">
    <div class="brand">
      <div class="mark"><svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="1.8" stroke-linejoin="round"/></svg></div>
      <span class="bname">SynqIO</span>
    </div>
    <h1>COLLE TON <span class="hl">URL</span>,<br>TON CATALOGUE<br>EST PRÊT</h1>
    <div class="punch">EN 30 SECONDES</div>
  </div>
  <div class="chip"><span class="dotg"></span>FLIPBOOK · TOUJOURS À JOUR</div>

  <div class="urlpill">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    <span class="u">maboutique.fr</span>
  </div>
  <div class="flow">
    <svg width="110" height="80" viewBox="0 0 110 80" fill="none">
      <path d="M10 10 C 40 30, 60 46, 76 64" stroke="#ffb020" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M46 62 L80 70 L74 36" stroke="#ffb020" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </div>

  <div class="bookw">
    <div class="spread">
      <div class="pageL"><div class="pgrid">
        <div class="prd"><div class="ph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><polyline points="21 15 16 10 5 21"/></svg></div><div class="ln a"></div><div class="pr">24,50 €</div></div>
        <div class="prd"><div class="ph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><polyline points="21 15 16 10 5 21"/></svg></div><div class="ln a"></div><div class="pr">18,00 €</div></div>
        <div class="prd"><div class="ph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><polyline points="21 15 16 10 5 21"/></svg></div><div class="ln a"></div><div class="pr">34,50 €</div></div>
        <div class="prd"><div class="ph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><polyline points="21 15 16 10 5 21"/></svg></div><div class="ln a"></div><div class="pr">21,00 €</div></div>
      </div></div>
      <div class="pageR"><div class="pgrid">
        <div class="prd"><div class="ph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><polyline points="21 15 16 10 5 21"/></svg></div><div class="ln a"></div><div class="pr">77,00 €</div></div>
        <div class="prd"><div class="ph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><polyline points="21 15 16 10 5 21"/></svg></div><div class="ln a"></div><div class="pr">12,00 €</div></div>
        <div class="prd"><div class="ph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><polyline points="21 15 16 10 5 21"/></svg></div><div class="ln a"></div><div class="pr">49,00 €</div></div>
        <div class="prd"><div class="ph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><polyline points="21 15 16 10 5 21"/></svg></div><div class="ln a"></div><div class="pr">36,00 €</div></div>
      </div></div>
    </div>
    <svg class="curl" viewBox="0 0 120 120" fill="none">
      <path d="M115 5 C 70 12, 40 40, 30 90 L 115 90 Z" fill="#ede9fe" opacity="0.95"/>
      <path d="M115 5 C 70 12, 40 40, 30 90" stroke="#c4b5fd" stroke-width="3"/>
    </svg>
  </div>
</div>
</body></html>
